android.useAndroidX=true
android.enableJetifier=true

# 2025-08-19 (audit-fix): restored upstream gradle.properties. The audit
# branch had aggressively reduced memory + disabled parallel workers +
# hard-coded /home/z/jdk as the JDK path so the project would build on a
# 4 GB RAM container — these are environment-specific workarounds and MUST
# NOT be merged upstream. The original upstream values are below.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Removed by audit-fix:
#   kotlin.compiler.execution.strategy=in-process     # was OOM workaround
#   kotlin.daemon.jvmargs=-Xmx512m ...                 # was OOM workaround
#   org.gradle.java.installations.paths=/home/z/jdk    # environment-specific
#   org.gradle.java.installations.auto-detect=false   # environment-specific
#   org.gradle.java.installations.from.digests=false  # environment-specific
#   org.gradle.parallel=false                         # was OOM workaround
#   org.gradle.workers.max=1                          # was OOM workaround
#   org.gradle.daemon=false                           # was OOM workaround
# If you need to build on a constrained machine, set these via
# `~/.gradle/gradle.properties` or `-P...` on the command line — do NOT
# commit them to the repo, they slow down every other contributor's build.

# Temporary stability mode (keep for now if you need it)
kapt.use.k2=false
kapt.incremental.apt=false
kapt.verbose=true
kapt.include.compile.classpath=false

ksp.useKSP2=false
ksp.incremental=false
ksp.incremental.intermodule=false

android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
