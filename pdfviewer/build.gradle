plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.horizontal.pdfviewer'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        viewBinding true
    }

    // No composeOptions needed on Kotlin 2.2.x with the plugin
    packagingOptions {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }
}

dependencies {
    // Align Kotlin libs with the toolchain
    implementation platform("org.jetbrains.kotlin:kotlin-bom:2.2.0")

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // 2025-08-20 (audit-fix rev 7): real PDF text extraction.
    //
    // The previous implementation used Android's framework PdfRenderer which
    // only renders pages to Bitmaps — it has no text API. The audit rev6
    // `PdfTextExtractor` rendered the page to a Bitmap, immediately
    // `recycle()`d it, and returned an empty StringBuilder, so "Copy page
    // text" always fell through to the misleading "may be a scanned image"
    // toast. PDFBox-Android is the Android port of Apache PDFBox; it parses
    // the actual PDF text stream and supports PDF 1.x + 2.0 spec. minSdk 21
    // is supported. Initialised lazily by `PDFBoxResourceLoader.init(context)`
    // on first use — see PdfTextExtractor.init.
    //
    // 2025-08-20 (audit-fix rev 8): exclude the transitive BouncyCastle
    // dependencies because the mobile app already ships bcprov-jdk18on
    // 1.81.1 (a newer version). Without this exclusion, D8 fails with
    // "Duplicate class org.bouncycastle.x509.*" because both jdk15to18 and
    // jdk18on ship the same classes under different artifact coordinates.
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15to18'
        exclude group: 'org.bouncycastle', module: 'bcutil-jdk15to18'
    }

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.04.01')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.04.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
